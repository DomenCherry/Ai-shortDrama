services:
  postgres:
    image: postgres:16
    container_name: ai-short-drama-postgres
    environment:
      POSTGRES_DB: ai_short_drama
      POSTGRES_USER: ai_short_drama
      POSTGRES_PASSWORD: ai_short_drama
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_short_drama -d ai_short_drama"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

